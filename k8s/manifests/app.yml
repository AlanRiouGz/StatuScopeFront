apiVersion: v1
kind: Service
metadata:
  name: statusscope-frontend
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: statusscope-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ int .Values.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statusscope-frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ int .Values.replicas }}
  selector:
    matchLabels:
      app: statusscope-frontend
  template:
    metadata:
      labels:
        app: statusscope-frontend
    spec:
      automountServiceAccountToken: false
      {{- if .Values.registrySecretName }}
      imagePullSecrets:
        - name: {{ .Values.registrySecretName }}
      {{- end }}
      containers:
        - name: statusscope-frontend
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: '2'
              memory: 256Mi
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          env:
            - name: BACKEND_HOST
              value: "statusscope-backend.{{ .Values.namespace }}.svc.cluster.local"
